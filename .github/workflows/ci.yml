name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend lint + syntax + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff httpx
      - name: Ruff check
        run: ruff check backend/app/
      - name: Backend syntax
        run: python -m compileall -q backend/app/
      - name: API + WS tests (self-contained suite)
        run: |
          bash scripts/install_venv.sh >/dev/null 2>&1 || true
          bash scripts/init_db.sh >/dev/null 2>&1 || true
          bash tests/run_security_suite.sh

  frontend:
    name: Frontend typecheck + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend deps
        run: npm ci
      - name: Typecheck
        run: npx vue-tsc --noEmit
      - name: Build
        run: npm run build
